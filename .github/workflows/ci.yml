name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  firmware:
    name: Firmware (native tests + ${{ matrix.board }} build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [geekmagic_ultra]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # Request headers must be read through web::requestHeader (src/web.h): the web server leaves
      # the previous request's bytes behind a header it "clears", so c_str()/toInt() on
      # server.header(...) can see another client's Authorization token.
      - name: No raw request-header reads
        run: "! grep -rnE 'header\\(F\\(\"[^\"]+\"\\)\\)\\.(c_str|toInt)' src"
      - run: pio test -e native
      # A warning, never a failure: releases refresh the table themselves (release.yml). It says
      # when a newer tz database is out than the committed table (run `make tz-table`, commit it).
      - name: Time zone table freshness
        run: |
          pip install --upgrade tzdata
          python scripts/check_tz_table.py --version || echo "::warning file=firmware/lib/miblo_core/src/miblo_tz_table.h::A newer IANA tz database is out: run 'make tz-table' in firmware/ and commit the result"
      - run: pio run -e ${{ matrix.board }}
      - run: pio run -e ${{ matrix.board }}_loader
      - run: pio run -e screenshots   # host screenshot tool (make screenshots) keeps building
      - run: .pio/build/screenshots/program --check /tmp/margins en pt-BR pt-PT es fr it de ru zh   # no screen too close to an edge
