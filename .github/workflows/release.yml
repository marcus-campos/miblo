name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FW="$(sed -n 's/^#define MIBLO_FW_VERSION "\(.*\)"$/\1/p' firmware/include/miblo_version.h)"
          PLUGIN="$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"
          echo "tag=$TAG firmware=$FW plugin=$PLUGIN"
          if [ "$TAG" != "$FW" ] || [ "$TAG" != "$PLUGIN" ]; then
            echo "::error::Tag v$TAG must match MIBLO_FW_VERSION ($FW) and plugin.json version ($PLUGIN)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin tests
        working-directory: plugin
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      # The table of zone rules frozen into the firmware, from the newest IANA tz database, so a
      # release never ships rules older than the day it was built (`make release` refreshes and
      # commits it too; this catches a tag made without it). The tests and the build below use it.
      - name: Refresh the time zone table (newest tzdata)
        working-directory: firmware
        run: |
          table="lib/miblo_core/src/miblo_tz_table.h lib/miblo_core/src/miblo_tz_table.cpp"
          if pip install --upgrade tzdata && python scripts/gen_tz_table.py > "$RUNNER_TEMP/tz.log"; then
            cat "$RUNNER_TEMP/tz.log"
            git diff --stat -- $table
            # A table that differs from the tag's is what ships: say so where the release is read.
            {
              echo "### Time zones"; echo; head -1 "$RUNNER_TEMP/tz.log"; echo
              if git diff --quiet -- $table; then echo "The committed table was already current."
              else echo "Shipped table differs from the tag's:"; echo '```'; git diff --stat -- $table; echo '```'; fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git checkout -- $table
            echo "::warning::Time zone table not refreshed: building with the committed one"
          fi
      - name: Firmware tests
        working-directory: firmware
        run: pio test -e native

      - name: Build firmware binaries
        working-directory: firmware
        run: |
          for board in geekmagic_ultra; do
            PIO=pio ./scripts/build.sh "$board"
          done
          ls -la dist

      - name: Checksums
        working-directory: firmware/dist
        run: sha256sum *.bin > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            firmware/dist/*.bin
            firmware/dist/SHA256SUMS.txt
