name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FW="$(sed -n 's/^#define MIBLO_FW_VERSION "\(.*\)"$/\1/p' firmware/include/miblo_version.h)"
          PLUGIN="$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"
          echo "tag=$TAG firmware=$FW plugin=$PLUGIN"
          if [ "$TAG" != "$FW" ] || [ "$TAG" != "$PLUGIN" ]; then
            echo "::error::Tag v$TAG must match MIBLO_FW_VERSION ($FW) and plugin.json version ($PLUGIN)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin tests
        working-directory: plugin
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Firmware tests
        working-directory: firmware
        run: pio test -e native

      - name: Build firmware binaries
        working-directory: firmware
        run: |
          for board in geekmagic_ultra; do
            PIO=pio ./scripts/build.sh "$board"
          done
          ls -la dist

      - name: Checksums
        working-directory: firmware/dist
        run: sha256sum *.bin > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            firmware/dist/*.bin
            firmware/dist/SHA256SUMS.txt
