; Miblo — gadget firmware. One env per board; today only the GeekMagic "Ultra" (ESP8266 + ST7789 240x240).
; To add a board: boards/README.md.

[platformio]
default_envs = geekmagic_ultra

[env]
lib_deps =
	bblanchon/ArduinoJson@6.21.5
	ricmoo/QRCode@0.0.1

[env:geekmagic_ultra]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
; 4 MB: ~1 MB sketch, ~2 MB free for the OTA image, 1 MB LittleFS (config/tokens).
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
lib_deps =
	${env.lib_deps}
	bodmer/TFT_eSPI@2.5.43
build_src_filter = +<*> +<../boards/geekmagic_ultra/>
; No firmware code formats or scans floats with printf/scanf (costs are printed with integers).
extra_scripts = post:loader/no_float_printf.py
build_flags =
	-I include
	-I boards/geekmagic_ultra
	-D MIBLO_BOARD_GEEKMAGIC_ULTRA=1
	-D MIBLO_ROM_IMPL=\"miblo_rom_esp8266.h\"
	; The largest program eagle.flash.4m1m.ld (the ldscript above) takes: its irom0_0_seg is
	; len 0xfeff0. The settings page's "Program (firmware)" bar measures the firmware against it.
	-D MIBLO_FW_MAX_BYTES=1044464
	; lwIP 2 low memory without IP forwarding/NAPT (never used); IGMP (mDNS) and the AP stay.
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	; Every QR code is version 3 (ui_base.cpp): the QR library then keeps 3 small constants
	; instead of its 40-version tables (~560 B that would sit in RAM).
	-D LOCK_VERSION=3
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=0
	-D TFT_RST=2
	-D TFT_BL=5
	-D TFT_BACKLIGHT_ON=LOW
	-D SPI_FREQUENCY=40000000
	-D TFT_RGB_ORDER=TFT_BGR
	; No TFT_eSPI bitmap font: every text is drawn with the u8g2 fonts (lib/U8g2TFT).

[env:geekmagic_ultra_loader]
; Miblo installer (stage 1): a tiny image that fits the stock GeekMagic firmware's small OTA
; space. Same board, flash layout and TFT pins as geekmagic_ultra, but builds ONLY loader/main.cpp
; (nothing from src/ or lib/ is linked) and only TFT_eSPI's built-in GLCD font.
extends = env:geekmagic_ultra
lib_deps =
	bodmer/TFT_eSPI@2.5.43
lib_ignore =
	U8g2TFT
	miblo_ui
	miblo_core
build_src_filter = -<*> +<../loader/>
extra_scripts = post:loader/no_float_printf.py
build_flags =
	${env:geekmagic_ultra.build_flags}
	-D LOAD_GLCD=1

[env:native]
platform = native
test_framework = unity
; QRCode declares itself an Arduino library, but it's plain C: allow it on the host.
lib_compat_mode = off
build_flags =
	-std=gnu++17
	-Wall
	-I include
	-D LOCK_VERSION=3
lib_ignore =
	U8g2TFT

; Host tool: renders every screen to PNG with the real TftCanvas and fonts (make screenshots).
[env:screenshots]
platform = native
lib_compat_mode = off
build_flags =
	-std=gnu++17
	-I include
	-I src
	-I boards/geekmagic_ultra
	-I tools/screenshots/shim
	-D LOCK_VERSION=3
build_src_filter = -<*> +<platform/tft_canvas.cpp> +<../tools/screenshots/>

; Native tests under AddressSanitizer + UndefinedBehaviorSanitizer (validation harness, make asan).
; Any sanitizer report aborts the test binary, so a suite fails on the first bug. See tools/fuzz/README.md.
[env:native_asan]
extends = env:native
build_type = debug
build_flags =
	${env:native.build_flags}
	-O1
	-g
	-fsanitize=address,undefined
	-fno-omit-frame-pointer
	-fno-sanitize-recover=undefined
extra_scripts = post:scripts/sanitize_link.py
